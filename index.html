<html lang="es">
<head>

  <link rel="apple-touch-icon" href="https://static.wixstatic.com/media/7d152f_3bc923794deb4698a531d279cc0fa41c~mv2.jpeg">

  <!-- META-ETIQUETAS OPEN GRAPH -->
  <meta property="og:type" content="website">

  <meta property="og:image" content="https://static.wixstatic.com/media/7d152f_3bc923794deb4698a531d279cc0fa41c~mv2.jpeg">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg-dark: #09050e;
      --bg-gradient: linear-gradient(180deg, #0b0614 0%, #120921 50%, #07030b 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.14);
      --purple-accent: #8b5cf6;
      --purple-glow: rgba(139, 92, 246, 0.45);
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-white);
      background: var(--bg-dark);
      background-image: var(--bg-gradient);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; display: block; }
    img, svg { display: block; }

    /* Luces radiales de fondo */
    .glow-top {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 560px;
      height: 460px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.3), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .glow-bottom {
      position: fixed;
      bottom: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 540px;
      height: 440px;
      background: radial-gradient(circle, rgba(109, 40, 217, 0.22), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .mesh-bg {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 65%);
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 65%);
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      padding: 34px 18px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* CABECERA Y FOTO */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
      width: 100%;
    }

    .monogram {
      width: clamp(102px, 28vw, 120px);
      height: clamp(102px, 28vw, 120px);
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(168, 85, 247, 0.55);
      box-shadow: 0 0 30px rgba(147, 51, 234, 0.45);
      margin-bottom: 16px;
      background: #120921;
    }

    .monogram img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: clamp(2.1rem, 9vw, 2.85rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      width: 100%;
    }

    .verified-badge {
      width: 1.15em;
      height: 1.15em;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 10px rgba(29, 155, 240, 0.55));
    }

    .hero .subtitle {
      font-size: 0.88rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #cbd5e1;
      font-weight: 700;
      margin-top: 6px;
    }

    /* BOTONES */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 22px;
      min-height: 86px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.025) 100%);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(.34, 1.56, .64, 1);
    }

    /* RESPUESTA TÁCTIL :active */
    .card-btn:active {
      transform: scale(0.97) !important;
      transition: 0.1s !important;
    }

    .card-btn:hover {
      border-color: rgba(168, 85, 247, 0.65);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 14px 34px rgba(139, 92, 246, 0.28);
    }

    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(124, 58, 237, 0.45), rgba(76, 29, 149, 0.3));
      border: 1px solid rgba(168, 85, 247, 0.45);
      flex-shrink: 0;
      color: #d8b4fe;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.25);
    }

    .card-icon svg {
      width: 26px;
      height: 26px;
    }

    .card-content {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 1.16rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* PUNTO VERDE ANIMADO */
    .online-indicator {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 9px;
      height: 9px;
      flex-shrink: 0;
    }

    .online-indicator .dot-core {
      width: 9px;
      height: 9px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .online-indicator .dot-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #22c55e;
      border-radius: 50%;
      animation: online-ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes online-ping {
      0% { transform: scale(1); opacity: 0.8; }
      75%, 100% { transform: scale(2.6); opacity: 0; }
    }

    .card-sub {
      font-size: 0.88rem;
      color: #cbd5e1;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-pulse {
      position: relative;
      border-color: rgba(168, 85, 247, 0.6);
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      animation: prime-pulse 2.2s infinite ease-in-out;
    }

    .card-pulse .card-icon {
      background: linear-gradient(145deg, #8b5cf6, #5b21b6);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.6);
      animation: rotate-wiggle 2.8s infinite ease-in-out;
    }

    @keyframes prime-pulse {
      0%, 100% {
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
        border-color: rgba(168, 85, 247, 0.45);
      }
      50% {
        box-shadow: 0 12px 36px rgba(139, 92, 246, 0.45);
        border-color: rgba(216, 180, 254, 0.9);
      }
    }

    @keyframes rotate-wiggle {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.08) rotate(-8deg); }
      40% { transform: scale(1.08) rotate(8deg); }
      60% { transform: scale(1) rotate(0deg); }
    }

    /* FRASE INFERIOR */
    .footer-desc {
      font-size: clamp(0.92rem, 3.8vw, 1.02rem);
      line-height: 1.6;
      color: #a1a1aa;
      max-width: 380px;
      text-align: center;
      margin-top: 36px;
      padding: 0 16px;
    }

    /* RESPONSIVE (< 380px) */
    @media (max-width: 380px) {
      .card-btn { padding: 16px 16px; gap: 12px; }
      .card-icon { width: 46px; height: 46px; }
      .card-icon svg { width: 22px; height: 22px; }
      .card-title { font-size: 1.05rem; }
      .card-sub { font-size: 0.8rem; }
    }

    /* Ocultar barra de Google Translate */
    #google_translate_element { display: none; }
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0px !important; }
    .goog-tooltip { display: none !important; }
    .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
  </style>
</head>

  <!-- TRADUCCIÓN AUTOMÁTICA -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es',
        autoDisplay: false
      }, 'google_translate_element');

      try {
        const userLang = (navigator.languages && navigator.languages[0]) || navigator.language || 'es';
        const langCode = userLang.slice(0, 2).toLowerCase();

        if (langCode !== 'es') {
          const checkSelect = setInterval(() => {
            const selectEl = document.querySelector('.goog-te-combo');
            if (selectEl) {
              selectEl.value = langCode;
              selectEl.dispatchEvent(new Event('change'));
              clearInterval(checkSelect);
            }
          }, 150);

          setTimeout(() => clearInterval(checkSelect), 4000);
        }
      } catch (e) {
        console.error("Error al detectar idioma:", e);
      }
    }
  </script>
